<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e9c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cvijetic HMS">
<meta name="application-name" content="Cvijetic HMS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Cvijetic HMS</title>
<style>
:root{--blue:#1f4e9c;--blue2:#163a76;--green:#3a9d3a;--green2:#2e7d2e;--bg:#f3f5f9;--card:#fff;--ink:#1b2333;--muted:#667085;--line:#e3e7ee;--red:#c62828;--ice:#e7f1ff;--iceb:#7fb0f0;--amber:#b26a00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:#fff url(icons/icon-192.png) center/cover no-repeat;flex:none}
.logo b{color:var(--green)}
.bt{font-weight:700;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs{font-size:11.5px;opacity:.8}
.hbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:20px;padding:7px 12px;cursor:pointer;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
main{max-width:860px;margin:0 auto;padding:16px 16px 110px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{display:flex;max-width:860px;width:100%}
.nb{flex:1;background:none;border:0;padding:8px 2px 9px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nb span{font-size:20px;line-height:1.1}
.nb.on{color:var(--blue);font-weight:700}
.tbar{position:sticky;top:56px;z-index:15;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer}
.tbar .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar b{font-variant-numeric:tabular-nums;font-size:17px}
.tbar button{background:#fff;color:var(--red);border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
h1{font-size:21px;margin:4px 0 12px}
h2{font-size:17px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.click{cursor:pointer}
.click:active{transform:scale(.995)}
.obj.wd{border-left:5px solid var(--iceb);background:linear-gradient(90deg,var(--ice),#fff 55%)}
.ot{font-weight:700;font-size:15.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13.5px}
.small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:#eef2f8;color:var(--blue2);white-space:nowrap}
.b-wd{background:#d6e8ff;color:#0d47a1}
.b-open{background:#fff3df;color:var(--amber)}
.b-in_progress{background:#e3efff;color:var(--blue)}
.b-done{background:#e2f4e2;color:var(--green2)}
.b-red{background:#fde7e7;color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
.btn.g{background:var(--green)}
.btn.r{background:var(--red)}
.btn.l{background:#eef2f8;color:var(--blue2)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.big{width:100%;padding:16px;font-size:18px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:auto;transform:scale(1.25);margin-right:8px}
.chk{display:flex;align-items:center;padding:8px 0;color:var(--ink);font-size:15px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#dde3ec;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.stat .n{font-size:26px;font-weight:800;color:var(--blue)}
.stat.g .n{color:var(--green)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line);font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f7f9fc;font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal-bg{align-items:center}.modal{border-radius:16px}}
.modal h3{margin:0 0 6px;font-size:18px}
.mact{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1b2333;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw;display:none}
.auth{max-width:420px;margin:7vh auto 0;padding:0 16px}
.auth .logo{width:88px;height:88px;border-radius:20px;margin:0 auto 10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs .chip{flex:1;text-align:center}
.install{background:var(--green);color:#fff;border:0;border-radius:12px;padding:12px;width:100%;font-weight:700;font-size:15px;cursor:pointer;margin:10px 0}
.pinbox{font-size:24px;letter-spacing:6px;text-align:center}
.auth .logo b{color:#9be39b}
.center{text-align:center}
.link{background:none;border:0;color:var(--blue);cursor:pointer;padding:8px;text-decoration:underline}
.langs{display:flex;gap:6px;justify-content:center;margin:14px 0}
.empty{color:var(--muted);text-align:center;padding:22px 0}
/* Plan / Kalender */
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calnav .ttl{flex:1;text-align:center;font-weight:700;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:12px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0;text-transform:uppercase;letter-spacing:.5px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:50px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;color:inherit}
.cd .dn{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.cd.out{opacity:.4}
.cd.today{border:2px solid var(--blue)}
.cd.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.cd .cnt{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:10px;background:#fff3df;color:var(--amber)}
.cd .cnt.ok{background:#e2f4e2;color:var(--green2)}
.cd .cnt.late{background:#fde7e7;color:var(--red)}
.cd.sel .cnt{background:#fff}
.day{margin-bottom:14px}
.dayh{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:2px solid var(--line);margin-bottom:8px}
.dayh.today{border-bottom-color:var(--blue)}
.dayh b{font-size:15px}
.dayh .grow{flex:1}
.pt{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.pt.in_progress{border-left-color:var(--blue)}
.pt.done{border-left-color:var(--green);opacity:.7}
.pt.done .pttl{text-decoration:line-through}
.pt .pttl{font-weight:600}
.pt .small{margin-top:2px}
.err{color:var(--red);font-size:13.5px;margin-top:8px}
.spin{text-align:center;color:var(--muted);padding:40px 0}
a{color:var(--blue)}
</style>
</head>

const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64ToU8 = b => { const p='='.repeat((4-b.length%4)%4); const r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); };
async function pushState(){
  if(!pushSupported()) return isIOS()&&!isStandalone()?'ios':'none';
  if(Notification.permission==='denied') return 'denied';
  try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); return sub&&Notification.permission==='granted'?'on':'off'; }catch(e){ return 'off'; }
}
async function enablePush(){
  try{
    const perm=await Notification.requestPermission(); if(perm!=='granted'){ toast(t('notifDenied'),5000); return route(); }
    const cfgRow=chk(await sb.from('app_config').select('value').eq('key','vapid_public').single());
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(cfgRow.value)});
    const j=sub.toJSON();
    chk(await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,user_id:S.me.id,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'}));
    toast(t('notifDone')); route();
  }catch(e){ toast(errMsg(e),5000); }
}
async function pushBanner(){
  const st=await pushState();
  if(st==='on'){ try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); const j=sub.toJSON(); sb.from('push_subscriptions').upsert({endpoint:j.endpoint,user_id:S.me.id,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'}).then(()=>{}); }catch(e){} return ''; }
  if(st==='ios') return `<div class="card small" style="background:#fff8ec;border-color:var(--amber)">🔔 ${t('notifIos')}</div>`;
  if(st==='denied') return `<div class="card small" style="background:#fff8ec;border-color:var(--amber)">🔔 ${t('notifDenied')}</div>`;
  if(st==='none') return '';
  return `<div class="card" style="background:#eef4ff;border-color:#bcd0f3"><div class="small">${t('notifText')}</div><button class="btn big" style="margin-top:8px;padding:12px;font-size:16px" onclick="enablePush()">${t('notifOn')}</button></div>`;
}

function chk(r){ if(r.error) throw r.error; return r.data; }
function toast(msg, ms=2600){ const el=$('#toast'); el.textContent=msg; el.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display='none', ms); }
function errMsg(e){ console.error(e); const m=(e&&(e.message||e.error_description))||String(e); return /fetch|network/i.test(m)?t('netErr'):m; }
function modal(html){ closeModal(); const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='mbg'; bg.innerHTML='<div class="modal">'+html+'</div>'; bg.addEventListener('click',e=>{ if(e.target===bg) closeModal(); }); document.body.appendChild(bg); }

function cfg(){
  let url=SUPABASE_URL, key=SUPABASE_KEY;
  if(!url||!key){ try{ const c=JSON.parse(localStorage.getItem('mp_cfg')||'{}'); url=c.url; key=c.key; }catch(e){} }
  return url&&key ? {url,key} : null;
}

/* ================= Start ================= */
function boot(){
  const c=cfg();
  if(!c) return renderSetup();
  sb = supabase.createClient(c.url, c.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev, session)=>{
    if(ev==='PASSWORD_RECOVERY'){ S.recovery=true; setTimeout(renderNewPassword,0); return; }
    const id = session?.user?.id || null;
    if(id!==S.uid){ S.uid=id; setTimeout(startApp,0); }
  });
}

function renderSetup(){
  $('#app').innerHTML = `<div class="auth"><div class="logo"></div><h1 class="center">${t('setupTitle')}</h1>
  <p class="muted center">${t('setupText')}</p>
  <label>Supabase Project URL</label><input id="su" placeholder="https://xxxx.supabase.co">
  <label>Supabase anon / publishable key</label><input id="sk" placeholder="eyJ… / sb_publishable_…">
  <div class="mact"><button class="btn" onclick="saveSetup()">${t('save')}</button></div></div>`;
}
function saveSetup(){
  const url=val('su').replace(/\/+$/,''), key=val('sk');
  if(!/^https:\/\/.+/.test(url)||key.length<20) return toast(t('required'));
  localStorage.setItem('mp_cfg', JSON.stringify({url,key})); boot();
}

async function doAuth(){
  const m=S.authMode, reg=m==='register', err=$('#aerr'), b=$('#abtn'), password=$('#ap').value;
  if(m==='phone'){
    const ph=normPhone(val('aph'));
    if(ph.length<8||!/^\d{6}$/.test(password)){ err.textContent=t('required'); return; }
    b.disabled=true; err.textContent='';
    const r=await sb.auth.signInWithPassword({email:phoneEmail(ph),password});
    if(r.error){ err.textContent=/invalid/i.test(r.error.message)?t('wrongPin'):errMsg(r.error); b.disabled=false; }
    return;
  }
  const email=val('ae');
  if(!email||!password||(reg&&!val('af'))){ err.textContent=t('required'); return; }
  if(password.length<6){ err.textContent=t('pwShort'); return; }
  b.disabled=true; err.textContent='';
  try{
    if(reg){
      const r=await sb.auth.signUp({email,password,options:{data:{full_name:val('af'),company:val('ac'),lang:LANG},emailRedirectTo:location.origin+location.pathname}});
      if(r.error) throw r.error;
      if(!r.data.session){ S.authMode='login'; renderAuth(); $('#aerr').style.color='var(--green2)'; $('#aerr').textContent=t('checkEmail'); }
    } else {
      const r=await sb.auth.signInWithPassword({email,password}); if(r.error) throw r.error;
    }
  }catch(e){ err.textContent=errMsg(e); b.disabled=false; }
}
async function forgotPw(){

  if(r.error) $('#aerr').textContent=errMsg(r.error); else { $('#aerr').style.color='var(--green2)'; $('#aerr').textContent=t('resetSent'); }

async function startApp(){
  clearInterval(S.tick); S.active=null; S.me=null;
  if(!S.uid){ closeModal(); return renderAuth(); }
  $('#app').innerHTML='<div class="spin">…</div>';
  try{
    let me = chk(await sb.from('profiles').select('*').eq('id',S.uid).maybeSingle());
    if(!me){ await new Promise(r=>setTimeout(r,1200)); me = chk(await sb.from('profiles').select('*').eq('id',S.uid).maybeSingle()); }
    if(!me) throw new Error('Profil fehlt / profile missing');
    S.me=me;
    if(me.lang && LANGS.includes(me.lang)){ LANG=me.lang; localStorage.setItem('mp_lang',LANG); }
    if(me.role==='pending'||me.role==='disabled') return renderPending();
    S.people = chk(await sb.from('profiles').select('id,full_name,role,company,email,phone').order('full_name'));
    if(me.role==='worker') await loadActive();
    S.view = me.role==='owner' ? 'dash' : 'objects'; S.param=null;
    try{ const qo=new URLSearchParams(location.search).get('obj'); if(qo){ S.view='obj'; S.param=qo; history.replaceState(null,'',location.pathname); } }catch(e){}
    route();

    $('#app').innerHTML=`<div class="auth"><div class="card"><div class="err">${esc(errMsg(e))}</div><div class="mact"><button class="btn l" onclick="logout()">${t('logout')}</button><button class="btn" onclick="startApp()">${t('refresh')}</button></div></div></div>`;

}

/* Wetter: live von Open-Meteo je Ort (min. Temperatur + Schneefall der nächsten 24 h). 15 Min. Zwischenspeicher. */
const WX_HOME={lat:49.142,lon:9.218};
async function geoTown(town){
  const k='hms_geo_'+town; try{ const c=localStorage.getItem(k); if(c) return JSON.parse(c); }catch(e){}
  const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=10&language=de&countryCode=DE&name='+encodeURIComponent(town)).then(x=>x.json());
  const d=(x)=>Math.hypot(x.latitude-WX_HOME.lat,(x.longitude-WX_HOME.lon)*0.65);
  const best=(r.results||[]).sort((a,b)=>d(a)-d(b))[0]; if(!best||d(best)>1.2) return null;
  const g={lat:best.latitude,lon:best.longitude}; try{ localStorage.setItem(k,JSON.stringify(g)); }catch(e){} return g;
}
async function loadWeather(){
  if(S.weather&&S.wxAt&&Date.now()-S.wxAt<15*60000) return;
  let towns=[];
  try{ const r=await sb.from('objects').select('city').eq('winterdienst',true).eq('active',true); towns=[...new Set((r.data||[]).map(o=>townOf(o.city)))]; }catch(e){}
  if(!towns.length){ try{ const r=await sb.from('weather').select('town'); towns=(r.data||[]).map(w=>w.town); }catch(e){} }
  const out={}; const now=new Date().toISOString();
  try{
    const gs=(await Promise.all(towns.map(async tw=>{ try{ const g=await geoTown(tw); return g?{tw,...g}:null; }catch(e){ return null; } }))).filter(Boolean);
    if(gs.length){
      const u='https://api.open-meteo.com/v1/forecast?latitude='+gs.map(g=>g.lat).join(',')+'&longitude='+gs.map(g=>g.lon).join(',')+'&hourly=temperature_2m,snowfall&current=temperature_2m,snowfall&forecast_hours=24&timezone=Europe%2FBerlin';
      let res=await fetch(u).then(x=>x.json()); if(!Array.isArray(res)) res=[res];
      res.forEach((w,i)=>{ const g=gs[i]; const h=w&&w.hourly; if(!g||!h||!h.temperature_2m) return;
        const temps=h.temperature_2m.filter(v=>typeof v==='number'); if(!temps.length) return;
        const snow=Math.round(h.snowfall.reduce((s,v)=>s+(v||0),0)*10)/10;
        out[g.tw]={town:g.tw,tmin_24h:Math.min(...temps),t_now:w.current?w.current.temperature_2m:null,snow_24h:snow,snow_now:w.current?(w.current.snowfall||0):0,checked_at:now};
      });
    }
  }catch(e){}
  towns.forEach(tw=>{ if(!out[tw]) out[tw]={town:tw,nodata:true,snow_24h:0,snow_now:0}; });
  S.weather=out; S.wxAt=Date.now();
}
function weatherCard(){
  const ws=Object.values(S.weather||{}); if(!ws.length) return '';
  ws.sort((a,b)=>(b.snow_24h-a.snow_24h)||a.town.localeCompare(b.town));
  const ok=ws.find(w=>w.checked_at); const when=ok?fmtDT(ok.checked_at):'';
  return `<div class="card" style="background:#eef6ff;border-color:#bcd0f3"><b>${t('weatherTitle')}</b> <span class="small muted">${when}</span>
   <div class="row" style="margin-top:6px;gap:6px">${ws.map(w=>w.nodata?`<span class="badge">${esc(w.town)}: ${t('wxNoData')}</span>`:`<span class="badge ${w.snow_now>0||w.snow_24h>0||w.tmin_24h<=0?'b-red':''}">${esc(w.town)}: ${w.snow_now>0?t('snowNow'):(w.snow_24h>0?w.snow_24h+' cm':t('noSnow'))} · ${w.t_now!=null?Math.round(w.t_now)+'° / ':''}min ${Math.round(w.tmin_24h)}°</span>`).join('')}</div></div>`;
}
function drawObjList(){

  document.querySelectorAll('#ochips .chip').forEach(c=>c.classList.toggle('on', c.dataset.m===mode));
  const wc=document.getElementById('wcard'); if(wc) wc.innerHTML=mode==='wd'?weatherCard():'';
  const list=(S.objs||[]).filter(o=>{
    if(mode==='active'&&!o.active) return false;
    if(mode==='arch'&&o.active) return false;

/* ================= Plan (Kalender) ================= */
const isoOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dOf = iso => { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); };
const addDaysISO = (iso,n) => { const d=dOf(iso); d.setDate(d.getDate()+n); return isoOf(d); };
const mondayOf = iso => { const d=dOf(iso); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return isoOf(d); };
function repeatDates(start, mode, until){
  if(!start||!mode||mode==='none') return [start||null];
  const end=until&&until>=start?until:addDaysISO(start,91), out=[]; let d=dOf(start); const day=d.getDate();
  for(let i=0;i<60;i++){
    const iso=isoOf(d); if(iso>end) break; out.push(iso);
    if(mode==='w1') d.setDate(d.getDate()+7);
    else if(mode==='w2') d.setDate(d.getDate()+14);
    else { d=new Date(d.getFullYear(),d.getMonth()+1,1); d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); }
  }
  return out;
}
function planRange(){
  const P=S.plan; if(!P.ref) P.ref=todayISO();
  if(P.mode==='week'){ const a=mondayOf(P.ref); return [a,addDaysISO(a,6)]; }
  const r=dOf(P.ref); const a=new Date(r.getFullYear(),r.getMonth(),1), b=new Date(r.getFullYear(),r.getMonth()+1,0);
  return [mondayOf(isoOf(a)), addDaysISO(mondayOf(isoOf(b)),6)];
}
function planShift(n){ const P=S.plan; if(P.mode==='week') P.ref=addDaysISO(mondayOf(P.ref||todayISO()),7*n); else { const r=dOf(P.ref||todayISO()); P.ref=isoOf(new Date(r.getFullYear(),r.getMonth()+n,1)); } P.sel=null; route(); }
function planToday(){ S.plan.ref=todayISO(); S.plan.sel=todayISO(); route(); }
function planMode(m){ S.plan.mode=m; S.plan.sel=S.plan.sel||todayISO(); S.plan.ref=S.plan.sel; route(); }
function planPick(iso){ S.plan.sel=iso; drawPlanDay(); document.querySelectorAll('.cd').forEach(c=>c.classList.toggle('sel',c.dataset.d===iso)); }
function planTask(x){
  const st=x.status||'open', late=st!=='done'&&x.due_date<todayISO();
  const click=S.me.role==='owner'?`taskForm('${x.object_id}','${x.id}')`:`go('obj','${x.object_id}')`;
  return `<div class="pt ${st}" onclick="${click}"><div class="row"><div class="pttl grow">${esc(x.title)}</div>${late?`<span class="badge b-red">!</span>`:''}<span class="badge b-${st}">${t('st_'+st)}</span></div>
   <div class="small muted">🏢 ${esc(x.objects?.name||'')}${S.me.role!=='client'?` · 👷 ${x.assigned_to?esc(pname(x.assigned_to)):`<span style="color:var(--red)">${t('unassigned')}</span>`}`:''}</div></div>`;
}
const canAdd = () => S.me.role==='owner'||S.me.role==='worker';
function dayBlock(iso){

async function loadImage(file){
  try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){ return await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
}
async function stampImage(file, when, label){
  const img=await loadImage(file);
  const w0=img.width, h0=img.height, sc=Math.min(1,1600/Math.max(w0,h0));
  const w=Math.round(w0*sc), h=Math.round(h0*sc);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.drawImage(img,0,0,w,h);
  const fs=Math.max(16,Math.round(w/38)), p=Math.round(fs*0.55);
  const txt=fmtDT(when)+'  ·  '+label;
  x.fillStyle='rgba(0,0,0,.55)'; x.fillRect(0,h-fs-p*2,w,fs+p*2);
  x.fillStyle='#fff'; x.font=`600 ${fs}px system-ui,-apple-system,sans-serif`; x.textBaseline='middle';
  x.fillText(txt,p,h-p-fs/2,w-p*2);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
}
async function uploadPhotos(oid, files){
  if(!files||!files.length) return;
  toast(t('uploading'),60000);
  const label=(S.curObj&&S.curObj.id===oid)?S.curObj.name:'';
  try{
    for(const f of files){
      const lm=f.lastModified?new Date(f.lastModified):new Date();
      const when=(lm>new Date()||lm<new Date(Date.now()-90*864e5))?new Date():lm;
      const blob=await stampImage(f,when,label);
      const path=`${oid}/${Date.now()}-${Math.random().toString(36).slice(2,10)}.jpg`;
      const up=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});
      if(up.error) throw up.error;
      chk(await sb.from('photos').insert({object_id:oid,path,taken_at:when.toISOString(),uploaded_by:S.me.id}));
    }
    toast(t('uploaded')); route();
  }catch(e){ toast(errMsg(e),5000); }
}

    if(r.error) throw (/already|registered|exists/i.test(r.error.message)?new Error(t('phoneExists')):r.error);
    const uid=r.data.user&&r.data.user.id; if(!uid) throw new Error('signup');
    try{ await tmp.auth.signOut(); }catch(e){}
    let ok=false; for(let i=0;i<5&&!ok;i++){ const u=await sb.from('profiles').update({role,phone,full_name:name,lang}).eq('id',uid).select('id'); ok=!u.error&&u.data&&u.data.length; if(!ok) await new Promise(r=>setTimeout(r,700)); }
    closeModal(); showPin(name,phone,pin,lang,true); vTeam();
  }catch(e){ $('#nwerr').textContent=errMsg(e); $('#nwb').disabled=false; }
}
function newClientForm(){
  modal(`<h3>${t('newClient').replace('+ ','')}</h3><div class="muted small">${t('newClientText')}</div>
   <label>${t('fullName')} *</label><input id="ncn" autocomplete="off">
   <label>${t('company').split('(')[0].trim()}</label><input id="ncc" placeholder="z. B. co.plan immo-concept GmbH">
   <label>${t('email')}</label><input id="nce" type="email" inputmode="email">
   <label>${t('phone')}</label><input id="ncp" type="tel" inputmode="tel" placeholder="0172 1234567">
   <label>${t('language')}</label><select id="ncl">${LANGS.map(l=>`<option value="${l}" ${l==='de'?'selected':''}>${LNAMES[l]}</option>`).join('')}</select>
   <div id="ncerr" class="err"></div>
   <div class="mact"><button class="btn l" onclick="closeModal()">${t('cancel')}</button><button class="btn g" id="ncb" onclick="createClient()">${t('save')}</button></div>`);
}
const newPw = () => { const a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return [...crypto.getRandomValues(new Uint8Array(10))].map(x=>a[x%a.length]).join(''); };
async function createClient(){
  const name=val('ncn'), company=val('ncc'), email=val('nce').toLowerCase(), phone=val('ncp'), lang=$('#ncl').value;
  if(!name){ $('#ncerr').textContent=t('required'); return; }
  if(!email&&normPhone(phone).length<8){ $('#ncerr').textContent=t('emailOrPhone'); return; }
  $('#ncb').disabled=true;
  const byEmail=!!email, pw=byEmail?newPw():newPinCode(), login=byEmail?email:phoneEmail(phone);
  try{
    const c=cfg(); const tmp=supabase.createClient(c.url,c.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'hms-tmp-c'}});
    const r=await tmp.auth.signUp({email:login,password:pw,options:{data:{full_name:name,company,lang}}});
    if(r.error) throw (/already|registered|exists/i.test(r.error.message)?new Error(t('phoneExists')):r.error);
    const uid=r.data.user&&r.data.user.id; if(!uid) throw new Error('signup');
    try{ await tmp.auth.signOut({scope:'local'}); }catch(e){}
    let ok=false; for(let i=0;i<5&&!ok;i++){ const u=await sb.from('profiles').update({role:'client',phone:phone||null,company:company||null,full_name:name,lang}).eq('id',uid).select('id'); ok=!u.error&&u.data&&u.data.length; if(!ok) await new Promise(r=>setTimeout(r,700)); }
    closeModal(); showClientAccess(name,email,phone,pw,lang); vTeam();
  }catch(e){ $('#ncerr').textContent=errMsg(e); $('#ncb').disabled=false; }
}
function clientText(name,email,phone,pw,lang){
  const url=location.origin+location.pathname;
  const how = email ? `E-Mail: ${email}\nPasswort: ${pw}` : `Handynummer: ${phone}\nPIN: ${pw}`;
  if(lang==='de'||!lang) return `Guten Tag ${name},\n\nab sofort können Sie Ihre Objekte, erledigte Arbeiten (mit Fotos) und Aufgaben in unserer App „Cvijetic HMS“ verfolgen und uns dort direkt Aufträge erteilen:\n${url}\n\nIhre Zugangsdaten:\n${how}\n\n${email?'Bitte unter „Kunde / Inhaber“ anmelden.':'Bitte unter „Mitarbeiter“ mit Handynummer und PIN anmelden.'}\n\nMit freundlichen Grüßen\nSaša Cvijetić\nCvijetic Hausmeisterservice · ${FIRM.phone}`;
  return `Hello ${name},\n\nyou can now follow your properties, completed work (with photos) and tasks in our app “Cvijetic HMS”:\n${url}\n\nYour access:\n${how}\n\nBest regards\nSaša Cvijetić · ${FIRM.phone}`;
}
function showClientAccess(name,email,phone,pw,lang){
  const txt=clientText(name,email,phone,pw,lang);
  const wa=phone?'https://wa.me/'+normPhone(phone)+'?text='+encodeURIComponent(txt):'';
  const mail=email?'mailto:'+email+'?subject='+encodeURIComponent('Ihr Zugang zur App Cvijetic HMS')+'&body='+encodeURIComponent(txt):'';
  modal(`<h3>✅ ${t('accountCreated')}</h3><div><b>${esc(name)}</b></div>
   <div class="card" style="margin-top:10px"><div class="small muted">${t('accessData')}</div>${email?`<div>✉️ ${esc(email)}</div>`:`<div>📱 ${esc(phone)}</div>`}<div style="font-size:22px;font-weight:800;letter-spacing:2px;margin-top:4px">${esc(pw)}</div></div>
   <div class="mact"><button class="btn l" onclick="closeModal()">${t('close')}</button>${mail?`<a class="btn" href="${mail}" style="text-decoration:none">${t('sendEmail')}</a>`:''}${wa?`<a class="btn g" href="${wa}" target="_blank" rel="noopener" style="text-decoration:none">${t('sendWhatsapp')}</a>`:''}</div>`);
}
async function clientAssignForm(cid){
  const [objs,oc]=await Promise.all([sb.from('objects').select('id,name,address,city,customer,active').order('name'), sb.from('object_clients').select('object_id').eq('client_id',cid)]);
  const list=chk(objs)||[], cur=new Set((chk(oc)||[]).map(x=>x.object_id));
  S.cassign={cid,cur};
  const comp=(S.people.find(p=>p.id===cid)||{}).company||'';
  modal(`<h3>${t('clientObjects')}</h3><div class="muted">🏢 ${esc(pname(cid))}${comp?' · '+esc(comp):''} · <span id="ccnt">${cur.size}</span> ${t('selected')}</div>
   <input id="cq" placeholder="${t('search')}" value="${esc(comp.split(' ')[0]||'')}" style="margin:10px 0" oninput="const q=this.value.toLowerCase();document.querySelectorAll('.crow').forEach(r=>r.hidden=!r.dataset.s.includes(q))">
   <div style="max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 10px">${list.filter(o=>o.active||cur.has(o.id)).map(o=>`<label class="chk crow" data-s="${esc([o.name,o.address,o.city,o.customer].join(' ').toLowerCase())}" style="border-bottom:1px solid var(--line)"><input type="checkbox" class="cw" value="${o.id}" ${cur.has(o.id)?'checked':''} onchange="document.getElementById('ccnt').textContent=document.querySelectorAll('.cw:checked').length"><span><b>${esc(o.name)}</b><br><span class="small muted">${esc([o.city,o.customer].filter(Boolean).join(' · '))}</span></span></label>`).join('')}</div>
   <div class="mact"><button class="btn l" onclick="closeModal()">${t('cancel')}</button><button class="btn" id="csave" onclick="saveClientAssign()">${t('save')}</button></div>`);
  $('#cq').dispatchEvent(new Event('input'));
}
async function saveClientAssign(){
  const {cid,cur}=S.cassign; const sel=new Set([...document.querySelectorAll('.cw:checked')].map(x=>x.value));
  const add=[...sel].filter(x=>!cur.has(x)), del=[...cur].filter(x=>!sel.has(x));
  $('#csave').disabled=true;
  try{
    if(del.length) chk(await sb.from('object_clients').delete().eq('client_id',cid).in('object_id',del));
    if(add.length) chk(await sb.from('object_clients').insert(add.map(o=>({object_id:o,client_id:cid}))));
    closeModal(); toast(t('saved'));
  }catch(e){ $('#csave').disabled=false; toast(errMsg(e)); }
}
function waText(name,pin,lang){
  const url=location.origin+location.pathname;
  const T={de:`Hallo ${name}, hier ist dein Zugang zur App Cvijetic HMS:\n${url}\nLink öffnen → „App installieren“ → mit Handynummer und PIN anmelden.\nPIN: ${pin}`,
   en:`Hi ${name}, here is your access to the Cvijetic HMS app:\n${url}\nOpen the link → “Install app” → sign in with your phone number and PIN.\nPIN: ${pin}`,
   sr:`Zdravo ${name}, ovo je tvoj pristup aplikaciji Cvijetic HMS:\n${url}\nOtvori link → „Instaliraj aplikaciju“ → prijavi se brojem telefona i PIN-om.\nPIN: ${pin}`,
   hr:`Bok ${name}, ovo je tvoj pristup aplikaciji Cvijetic HMS:\n${url}\nOtvori poveznicu → „Instaliraj aplikaciju“ → prijavi se brojem telefona i PIN-om.\nPIN: ${pin}`,
   tr:`Merhaba ${name}, Cvijetic HMS uygulamasına erişimin:\n${url}\nBağlantıyı aç → “Uygulamayı yükle” → telefon numaran ve PIN ile giriş yap.\nPIN: ${pin}`};
  return T[lang]||T.de;
}
function showPin(name,phone,pin,lang,isNew){
  const wa='https://wa.me/'+normPhone(phone)+'?text='+encodeURIComponent(waText(name,pin,lang));
  modal(`<h3>${isNew?'✅ '+t('accountCreated'):t('newPin')}</h3><div><b>${esc(name)}</b> · 📱 ${esc(phone)}</div>
   <div class="card center" style="margin-top:12px;font-size:30px;letter-spacing:8px;font-weight:800">${pin}</div>
   <div class="mact"><button class="btn l" onclick="closeModal()">${t('close')}</button><a class="btn g" href="${wa}" target="_blank" rel="noopener" style="text-decoration:none">${t('sendWhatsapp')}</a></div>`);
}
async function resetPin(id){
  const p=person(id)||S.people.find(x=>x.id===id); if(!p) return;
  if(!confirm(t('newPin')+' – '+(p.full_name||'')+'?')) return;
  const pin=newPinCode();
  try{ chk(await sb.rpc('owner_set_pin',{target:id,pin})); showPin(p.full_name||'',p.phone||'',pin,'sr',false); }catch(e){ toast(errMsg(e),5000); }
}
async function removeMember(id){
  const p=S.people.find(x=>x.id===id); if(!confirm(t('removeConfirm')+'\n\n'+((p&&p.full_name)||''))) return;
  try{ chk(await sb.rpc('delete_account',{target:id})); toast(t('saved')); vTeam(); }catch(e){ toast(errMsg(e),5000); }
}
async function assignForm(wid){
  const [objs,ow]=await Promise.all([sb.from('objects').select('id,name,address,city,customer,active').order('name'), sb.from('object_workers').select('object_id').eq('worker_id',wid)]);
  const list=chk(objs)||[], cur=new Set((chk(ow)||[]).map(x=>x.object_id));
  S.assign={wid,cur};
  modal(`<h3>${t('assignObjects')}</h3><div class="muted">👷 ${esc(pname(wid))} · <span id="acnt">${cur.size}</span> ${t('selected')}</div>
   <input id="aq" placeholder="${t('search')}" style="margin:10px 0" oninput="const q=this.value.toLowerCase();document.querySelectorAll('.arow').forEach(r=>r.hidden=!r.dataset.s.includes(q))">
   <div style="max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 10px">${list.map(o=>`<label class="chk arow" data-s="${esc([o.name,o.address,o.city,o.customer].join(' ').toLowerCase())}" style="border-bottom:1px solid var(--line)"><input type="checkbox" class="aw" value="${o.id}" ${cur.has(o.id)?'checked':''} onchange="document.getElementById('acnt').textContent=document.querySelectorAll('.aw:checked').length"><span><b>${esc(o.name)}</b><br><span class="small muted">${esc([o.city,o.customer].filter(Boolean).join(' · '))}</span></span></label>`).join('')}</div>
   <div class="mact"><button class="btn l" onclick="closeModal()">${t('cancel')}</button><button class="btn" id="asave" onclick="saveAssign()">${t('save')}</button></div>`);
}
async function saveAssign(){
  const {wid,cur}=S.assign; const sel=new Set([...document.querySelectorAll('.aw:checked')].map(x=>x.value));
  const add=[...sel].filter(x=>!cur.has(x)), del=[...cur].filter(x=>!sel.has(x));
  $('#asave').disabled=true;
  try{
    if(del.length) chk(await sb.from('object_workers').delete().eq('worker_id',wid).in('object_id',del));
    if(add.length) chk(await sb.from('object_workers').insert(add.map(o=>({object_id:o,worker_id:wid}))));
    closeModal(); toast(t('saved'));
  }catch(e){ $('#asave').disabled=false; toast(errMsg(e)); }
}
async function setRole(id,role){
  try{ chk(await sb.from('profiles').update({role}).eq('id',id)); toast(t('saved')); route(); }catch(e){ toast(errMsg(e)); route(); }
}
function copyLink(){
  const u=location.origin+location.pathname;
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast(t('copied'))).catch(()=>prompt('Link',u));
}

/* ================= Profil ================= */
function openProfile(){
  const m=S.me;
  modal(`<h3>${t('profile')}</h3><div class="muted small">${isPhoneAcc(m.email)?'📱 '+esc(m.phone||''):esc(m.email)} · ${roleName(m.role)}</div>
   <label>${t('fullName')}</label><input id="pn" value="${esc(m.full_name)}">
   <label>${t('phone')}</label><input id="pp" type="tel" value="${esc(m.phone||'')}">
   <label>${t('language')}</label><select id="pl">${LANGS.map(l=>`<option value="${l}" ${l===LANG?'selected':''}>${LNAMES[l]}</option>`).join('')}</select>
   ${installBtn()}
   <div id="pbanner"></div>
   <div class="mact"><button class="btn l" onclick="closeModal()">${t('cancel')}</button><button class="btn" onclick="saveProfile()">${t('save')}</button></div>
   <div style="margin-top:12px">${contactCard()}</div>
   <div class="mact" style="border-top:1px solid var(--line);padding-top:14px;justify-content:space-between"><button class="btn l" onclick="logout()">⎋ ${t('logout')}</button>${m.role==='owner'?'':`<button class="btn r sm" onclick="deleteAccountForm()">🗑 ${t('deleteAccount')}</button>`}</div>`);
}
function fillProfileBanner(){ pushBanner().then(h=>{ const el=$('#pbanner'); if(el) el.innerHTML=h||`<div class="small muted">${t('notifDone')}</div>`; }); }
function deleteAccountForm(){
  modal(`<h3>⚠️ ${t('deleteAccount')}</h3><p class="muted">${t('deleteAccountText')}</p>
   <label>${t('typeDelete')}</label><input id="dconf" autocomplete="off">
   <div class="mact"><button class="btn l" onclick="closeModal()">${t('cancel')}</button><button class="btn r" id="dbtn" onclick="doDeleteAccount()">${t('deleteAccount')}</button></div>`);
}
async function doDeleteAccount(){
  const w=val('dconf').toUpperCase();
  if(w!==t('deleteWord').toUpperCase()&&w!=='LÖSCHEN'&&w!=='DELETE'){ toast(t('typeDelete')); return; }
  $('#dbtn').disabled=true;
  try{ chk(await sb.rpc('delete_account',{})); closeModal(); clearInterval(S.tick); try{ await sb.auth.signOut({scope:'local'}); }catch(e){} S.uid=null; S.me=null; renderAuth(t('accountDeleted')); }
  catch(e){ $('#dbtn').disabled=false; toast(errMsg(e),5000); }
}
const _openProfile=openProfile; openProfile=function(){ _openProfile(); fillProfileBanner(); };
async function saveProfile(){
  const rec={full_name:val('pn'),phone:val('pp')||null,lang:val('pl')};
  try{
    chk(await sb.from('profiles').update(rec).eq('id',S.me.id));
    Object.assign(S.me,rec); LANG=rec.lang; localStorage.setItem('mp_lang',LANG);
    const p=person(S.me.id); if(p) Object.assign(p,rec);
    closeModal(); toast(t('saved')); route();
  }catch(e){ toast(errMsg(e)); }
}

document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.me && S.me.role==='worker'){ loadActive().then(drawTimer); } });
if(typeof supabase==='undefined'){ document.getElementById('app').innerHTML='<div class="auth"><div class="card err">'+t('netErr')+'</div></div>'; } else boot();
</script>
